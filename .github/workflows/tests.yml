# Runs the test suite on every pull request and on every push to main, so a contribution
# shows whether it still passes before anyone reads the diff.
name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: npm test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # The suite runs on plain Node. The install scripts would fetch the Electron binary
      # and rebuild the Bluetooth module, which no test touches and which costs minutes.
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run the suite
        run: npm test
