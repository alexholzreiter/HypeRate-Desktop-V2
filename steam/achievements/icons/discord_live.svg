  <ellipse cx="128" cy="196" rx="70" ry="10" fill="#9d8bff" opacity=".25" filter="url(#rays)"/>
  <g transform="translate(48 44) scale(6.6667)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    
