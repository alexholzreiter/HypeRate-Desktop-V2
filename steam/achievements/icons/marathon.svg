<rect x="13" y="13" width="230" height="230" rx="47" fill="none" stroke="url(#frame)" stroke-width="7"/>
<rect x="18.5" y="18.5" width="219" height="219" rx="42" fill="none" stroke="#ffffff" stroke-opacity=".18" stroke-width="1.2"/>
