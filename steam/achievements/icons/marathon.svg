  <ellipse cx="128" cy="176" rx="70" ry="10" fill="#2fe0c3" opacity=".25" filter="url(#rays)"/>
  <g transform="translate(48 26) scale(6.6667)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    
    <path d="M6 21V3.5M6 4h11.5l-2.5 4 2.5 4H6" stroke="#2fe0c3" stroke-width="3.6" filter="url(#glow)" opacity=".9"/>
    <path d="M6 21V3.5M6 4h11.5l-2.5 4 2.5 4H6" stroke="url(#glyph)" stroke-width="2.1" filter="url(#shadow)"/>
  </g>
  <rect x="98" y="190" width="60" height="38" rx="19" fill="url(#frame)" stroke="#000" stroke-opacity=".4"/>
  <text x="128" y="216" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Inter, Arial, sans-serif" font-size="25" font-weight="900" fill="#0a0d1c" letter-spacing=".5">4h</text>
  <rect width="256" height="256" fill="url(#vignette)"/>
