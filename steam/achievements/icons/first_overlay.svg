<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
<defs>
  <clipPath id="tile"><rect x="10" y="10" width="236" height="236" rx="50"/></clipPath>
  <radialGradient id="bg" cx=".5" cy=".38" r=".75"><stop offset="0" stop-color="#0e2370"/><stop offset=".55" stop-color="#0a0d1c"/><stop offset="1" stop-color="#030409"/></radialGradient>
  <radialGradient id="spot" cx=".5" cy=".05" r=".8"><stop offset="0" stop-color="#5b8cff" stop-opacity=".55"/><stop offset=".5" stop-color="#5b8cff" stop-opacity=".08"/><stop offset="1" stop-color="#5b8cff" stop-opacity="0"/></radialGradient>
  <radialGradient id="vignette" cx=".5" cy=".5" r=".72"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".75"/></radialGradient>
  <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1"><stop offset="0.00" stop-color="#c4d6ff"/><stop offset="0.33" stop-color="#2a4fb8"/><stop offset="0.67" stop-color="#a9c2ff"/><stop offset="1.00" stop-color="#16307a"/></linearGradient>
  <linearGradient id="glyph" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#5b8cff"/></linearGradient>
  <linearGradient id="heart" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6b85"/><stop offset=".6" stop-color="#e0153f"/><stop offset="1" stop-color="#7a0620"/></linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.1"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="1.2"/></filter>
