  <radialGradient id="spot" cx=".5" cy=".05" r=".8"><stop offset="0" stop-color="#dfe7f2" stop-opacity=".55"/><stop offset=".5" stop-color="#dfe7f2" stop-opacity=".08"/><stop offset="1" stop-color="#dfe7f2" stop-opacity="0"/></radialGradient>
  <radialGradient id="vignette" cx=".5" cy=".5" r=".72"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".75"/></radialGradient>
  <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1"><stop offset="0.00" stop-color="#ffffff"/><stop offset="0.33" stop-color="#7d8898"/><stop offset="0.67" stop-color="#e6edf5"/><stop offset="1.00" stop-color="#4a5462"/></linearGradient>
