  <radialGradient id="bg" cx=".5" cy=".38" r=".75"><stop offset="0" stop-color="#4a2208"/><stop offset=".55" stop-color="#0a0d1c"/><stop offset="1" stop-color="#030409"/></radialGradient>
  <radialGradient id="spot" cx=".5" cy=".05" r=".8"><stop offset="0" stop-color="#f0a868" stop-opacity=".55"/><stop offset=".5" stop-color="#f0a868" stop-opacity=".08"/><stop offset="1" stop-color="#f0a868" stop-opacity="0"/></radialGradient>
  <radialGradient id="vignette" cx=".5" cy=".5" r=".72"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".75"/></radialGradient>
  <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1"><stop offset="0.00" stop-color="#ffd0a6"/><stop offset="0.33" stop-color="#8a4a1c"/><stop offset="0.67" stop-color="#f0b27a"/><stop offset="1.00" stop-color="#5a2a0c"/></linearGradient>
